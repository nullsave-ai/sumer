name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Godot 4.7 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download & Install Godot 4.7
        shell: bash
        run: |
          set -e
          GODOT_VER="4.7-stable"
          TEMPLATES_VER="4.7.stable"
          
          echo "Downloading Godot ${GODOT_VER}..."
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VER}_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VER}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          rm -f "Godot_v${GODOT_VER}_linux.x86_64.zip"

          echo "Downloading Export Templates..."
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VER}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${TEMPLATES_VER}
          cp -r templates/* ~/.local/share/godot/export_templates/${TEMPLATES_VER}/
          rm -rf templates "Godot_v${GODOT_VER}_export_templates.tpz"
          
          godot --version

      - name: Generate Debug Keystore & Config
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/shutdown_adb_on_exit = true
          export/android/force_system_user = false
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Assets
        shell: bash
        run: |
          mkdir -p build
          godot --headless --editor --quit || true

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/sumer.apk
          ls -lh build/sumer.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumer-apk
          path: build/sumer.apk
          retention-days: 30

      - name: Release APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 build/sumer.apk \
            --title "Sumer v1.0.0 (Android APK)" \
            --notes "لعبة سومر (Sumer) للهاتف Android جاهزة للتحميل المباشر والتثبيت." \
            --clobber
